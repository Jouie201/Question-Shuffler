<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-400 Level 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="exam-title">AZ-400</p>

        <div class="question-meta">
          <span id="questionCount">Level 3 ready</span>
          <span id="quizStatus">Select an answer for each question</span>
        </div>

        <article class="exam-card" aria-live="polite">
          <section class="exam-body">
            <p class="stage-label">Level 3: Dropdown</p>
            <div id="promptContainer" class="question-prompt"></div>
          </section>

          <footer class="answer-panel">
            <div class="quiz-actions">
              <button id="nextButton" class="shuffle-button" type="button" disabled>
                Next Question
              </button>
            </div>
          </footer>
        </article>
      </section>
    </main>

    <script src="level3.js"></script>
  </body>
</html>
