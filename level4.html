<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-400 Level 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="exam-title">AZ-400</p>

        <div class="question-meta">
          <span id="questionCount">Level 4 ready</span>
          <span id="quizStatus">Select Yes or No</span>
        </div>

        <article class="exam-card" aria-live="polite">
          <section class="exam-body">
            <p class="stage-label">Level 4: Yes or No</p>
            <p id="questionPrompt" class="question-prompt"></p>
            <ul id="choiceList" class="choice-list"></ul>
          </section>

          <footer class="answer-panel">
            <div class="quiz-actions">
              <button id="nextButton" class="shuffle-button" type="button">
                Next Question
              </button>
            </div>
          </footer>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      &copy; <span id="footerYear"></span> Jouie Embudo Jr. All rights reserved.
    </footer>
    <script src="level4.js"></script>
    <script>document.getElementById("footerYear").textContent = new Date().getFullYear();</script>
  </body>
</html>
