<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-400 Level 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <div class="exam-header">
          <p class="exam-title">AZ-400</p>
          <button id="homeButton" class="home-button" type="button" aria-label="Back to level select" hidden>
            &#8962; Back to Level Select
          </button>
        </div>

        <div class="toolbar">
          <div class="toolbar-actions"></div>
          <div class="toolbar-end">
            <button id="prevButton" class="prev-button" type="button" aria-label="Go to previous question" hidden>
              &#8592; Previous
            </button>
            <button id="retryButton" class="retry-button" type="button" title="Reset this question and try again" hidden>
              <span class="retry-icon" aria-hidden="true">&#8635;</span> Retry
            </button>
          </div>
        </div>

        <div class="question-meta">
          <span id="questionCount">Level 3 ready</span>
          <span id="quizStatus">Select an answer for each question</span>
        </div>

        <article class="exam-card" aria-live="polite">
          <section class="exam-body">
            <p class="stage-label">Level 3: Dropdown</p>
            <div id="promptContainer" class="question-prompt"></div>
          </section>

          <footer class="answer-panel">
            <div class="quiz-actions">
              <button id="nextButton" class="shuffle-button" type="button" disabled>
                Next Question
              </button>
            </div>
          </footer>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      &copy; <span id="footerYear"></span> Jouie Embudo Jr. All rights reserved.
    </footer>
    <script src="level3.js"></script>
    <script>document.getElementById("footerYear").textContent = new Date().getFullYear();</script>
  </body>
</html>
