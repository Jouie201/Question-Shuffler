<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-400 Level 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="exam-title">AZ-400</p>

        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="shuffleOptionsButton" class="shuffle-button" type="button">
              Shuffle Options
            </button>
          </div>
        </div>

        <div class="question-meta">
          <span id="questionCount">Level 2 ready</span>
          <span id="shuffleStatus">Drag each option into the correct slot</span>
        </div>

        <article class="exam-card" aria-live="polite">
          <section class="exam-body">
            <p class="stage-label">Level 2: Drag and Drop</p>
            <p id="dragQuestionPrompt" class="question-prompt"></p>

            <div class="drag-layout">
              <section class="drag-panel" aria-labelledby="dragOptionsTitle">
                <h2 id="dragOptionsTitle" class="drag-section-title">Options</h2>
                <div id="dragOptionBank" class="drag-option-bank"></div>
              </section>

              <section class="drag-panel" aria-labelledby="dragAnswerAreaTitle">
                <h2 id="dragAnswerAreaTitle" class="drag-section-title">Answer Area</h2>
                <div id="dragTargetList" class="drag-target-list"></div>
              </section>
            </div>
          </section>

          <footer class="answer-panel">
            <div class="quiz-actions">
              <button id="nextQuestionButton" class="shuffle-button" type="button">
                Next Question
              </button>
            </div>
          </footer>
        </article>
      </section>
    </main>

    <script src="level2.js"></script>
  </body>
</html>
