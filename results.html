<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel results-panel">
        <p class="exam-title">AZ-400</p>
        <div class="results-card">
          <p class="score-label">Final Score</p>
          <p id="scoreText" class="score-text">0 / 0</p>
          <button id="takeAgainButton" class="shuffle-button" type="button">
            Take Again
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      &copy; <span id="footerYear"></span> Jouie Embudo Jr. All rights reserved.
    </footer>
    <script src="results.js"></script>
    <script>document.getElementById("footerYear").textContent = new Date().getFullYear();</script>
  </body>
</html>
